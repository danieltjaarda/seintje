name: Seintje
options:
  bundleIdPrefix: nl.danieltjaarda
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 254RH96NK7
    CODE_SIGN_STYLE: Automatic
targets:
  Seintje:
    type: application
    platform: iOS
    sources:
      - path: Seintje
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.danieltjaarda.seintje
        PRODUCT_NAME: Seintje
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Seintje
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_LANGUAGE: nl
        CODE_SIGN_ENTITLEMENTS: Seintje/Resources/Seintje.entitlements
